<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Attractor Vehicle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000
        }

        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            font: 12px monospace;
            z-index: 20;
            background: rgba(0, 0, 0, .35);
            padding: 8px
        }

        canvas {
            display: block
        }
    </style>
</head>
<body>
<div id="hud"></div>
<script type="importmap">{
"imports": {
"three":"./node_modules/three/build/three.webgpu.js",
"three/webgpu":"./node_modules/three/build/three.webgpu.js",
"three/tsl":"./node_modules/three/build/three.tsl.js",
"three/addons/":"./node_modules/three/examples/jsm/"
}}
</script>
<script type="module">
    import * as THREE from 'three/webgpu';
    import {
        float,
        If,
        PI,
        color,
        cos,
        instanceIndex,
        Loop,
        mix,
        mod,
        sin,
        instancedArray,
        Fn,
        uint,
        uniform,
        uniformArray,
        hash,
        vec3,
        vec4
    } from 'three/tsl';
    import {Inspector} from 'three/addons/inspector/Inspector.js';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {TransformControls} from 'three/addons/controls/TransformControls.js';

    const CAMERA_FOV = 75;
    const SIDE_CAMERA_ANGLE = Math.PI / 3;
    const RIG_POSITION = [0.0, 0.5, 1.0];
    let scene, renderer, controls, updateCompute, vehicleRig, frontCamera, leftCamera, rightCamera;

    const hud = document.getElementById('hud');
    const INNER_DIM = 0.3;
    init();

    async function init() {
        scene = new THREE.Scene();
        scene.add(new THREE.AmbientLight('#ffffff', 0.5));
        const dl = new THREE.DirectionalLight('#ffffff', 1.5);
        dl.position.set(4, 2, 0);
        scene.add(dl);
        await initRendererMode();
        await initRig();
        await initParticles();
        window.addEventListener('resize', onResize);
        animate();
    }

    async function initRig() {
        vehicleRig = new THREE.Group();
        scene.add(vehicleRig);
        const aspect = window.innerWidth / window.innerHeight;
        frontCamera = new THREE.PerspectiveCamera(CAMERA_FOV, aspect, .01, 200);
        leftCamera = new THREE.PerspectiveCamera(CAMERA_FOV, aspect, .01, 200);
        rightCamera = new THREE.PerspectiveCamera(CAMERA_FOV, aspect, .01, 200);
        frontCamera.position.set(RIG_POSITION[0], RIG_POSITION[1], RIG_POSITION[2]);
        leftCamera.position.set(RIG_POSITION[0], RIG_POSITION[1], RIG_POSITION[2]);
        rightCamera.position.set(RIG_POSITION[0], RIG_POSITION[1], RIG_POSITION[2]);
        frontCamera.rotation.y = 0;
        leftCamera.rotation.y = SIDE_CAMERA_ANGLE;
        rightCamera.rotation.y = -SIDE_CAMERA_ANGLE;
        vehicleRig.add(frontCamera, leftCamera, rightCamera);
        controls = new OrbitControls(frontCamera, renderer.domElement);
        controls.enableDamping = true;
    }

    async function initRendererMode() {
        renderer = new THREE.WebGPURenderer({antialias: true});
        renderer.setPixelRatio(devicePixelRatio);
        renderer.setSize(innerWidth, innerHeight);
        renderer.setAnimationLoop(animate);
        renderer.setClearColor('#000000');
        renderer.inspector = new Inspector();
        document.body.appendChild(renderer.domElement);
        await renderer.init();
        hud.textContent = 'MODE: static vehicle / 1S3V';
    }

    async function initParticles() {

        // ---------
        // attractors

        const attractorsPositions = uniformArray([
            new THREE.Vector3(-1, 0, 0),
            new THREE.Vector3(1, 0, -0.7),
            new THREE.Vector3(0, 0.5, 1)
        ]);
        const attractorsRotationAxes = uniformArray([
            new THREE.Vector3(0.2, 1, 0),
            new THREE.Vector3(0, 1, -0.2),
            new THREE.Vector3(0.6, 0, -0.75).normalize()
        ]);
        const attractorsLength = uniform(attractorsPositions.array.length, 'uint');
        const helpersRing = new THREE.RingGeometry(1, 1.02, 32, 1, 0, Math.PI * 1.5);
        const helpersArrow = new THREE.ConeGeometry(0.05, 0.2, 6, 1, false);
        const helpersMaterial = new THREE.MeshBasicMaterial( {side: THREE.DoubleSide, transparent: true, opacity: 0.2} );

        // // alternate option for moving vehicle
        // window.addEventListener('keydown', function (event) {
        //     switch (event.key) {
        //         case 'g':
        //             transformControls.setMode('translate')
        //             break
        //         case 'r':
        //             transformControls.setMode('rotate')
        //             break
        //         case 's':
        //             transformControls.setMode('scale')
        //             break
        //     }
        // })

        const attractors = [];
        for (let i = 0; i < attractorsPositions.array.length; i++) {
            const a = {};
            a.position = attractorsPositions.array[i];
            a.orientation = attractorsRotationAxes.array[i];
            a.reference = new THREE.Object3D();
            a.reference.position.copy(a.position);
            a.reference.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), a.orientation);
            scene.add(a.reference);

            a.helper = new THREE.Group();
            a.helper.scale.setScalar(0.325);
            a.reference.add(a.helper);

            a.ring = new THREE.Mesh(helpersRing, helpersMaterial);
            a.ring.rotation.x = -Math.PI * 0.5;
            a.helper.add(a.ring);

            a.arrow = new THREE.Mesh(helpersArrow, helpersMaterial);
            a.arrow.position.x = 1;
            a.arrow.position.z = 0.2;
            a.arrow.rotation.x = Math.PI * 0.5;
            a.helper.add(a.arrow);

            a.controls = new TransformControls(frontCamera, renderer.domElement);
            a.controls.mode = 'rotate';
            a.controls.size = .5;
            a.controls.attach(a.reference);
            scene.add(a.controls.getHelper());

            a.controls.addEventListener('dragging-changed', (event) => {
                controls.enabled = ! event.value;
            });

            a.controls.addEventListener('change', () => {
                a.position.copy(a.reference.position);
                a.orientation.copy(new THREE.Vector3(0, 1, 0).applyQuaternion(a.reference.quaternion));
            });

            attractors.push(a);
        }

        // ---------
        // particles

        const count = Math.pow(2, 15);
        const material = new THREE.SpriteNodeMaterial({blending: THREE.AdditiveBlending, depthWrite: false});
        const attractorMass = uniform(Number('1e7'));
        const particleGlobalMass = uniform(Number('1e4'));
        const timeScale = uniform(1);
        const spinningStrength = uniform(2.75);
        const maxSpeed = uniform(8);
        const gravityConstant = 6.67e-11;
        const velocityDamping = uniform(.1);
        const scale = uniform(.008);
        const boundHalfExtent = uniform(8);
        const innerHalfExtent = uniform(new THREE.Vector3(INNER_DIM, INNER_DIM, INNER_DIM));
        const colorA = uniform(color('#5900ff'));
        const colorB = uniform(color('#ffa575'));
        const positionBuffer = instancedArray(count, 'vec3');
        const velocityBuffer = instancedArray(count, 'vec3');

        const sphericalToVec3 = Fn(([phi, theta]) => {
            const s = sin(phi);
            return vec3(s.mul(sin(theta)), cos(phi), s.mul(cos(theta)))
        });

        const initFn = Fn(() => {
            const p = positionBuffer.element(instanceIndex);
            const v = velocityBuffer.element(instanceIndex);
            p.assign(vec3(hash(instanceIndex), hash(instanceIndex.add(uint(7))), hash(instanceIndex.add(uint(13)))).sub(.5).mul(vec3(5, .2, 5)));
            v.assign(sphericalToVec3(hash(instanceIndex).mul(PI).mul(2), hash(instanceIndex.add(uint(3))).mul(PI)).mul(.05));
        });

        // ---------
        // init compute

        const initCompute = initFn().compute(count);
        (renderer || rendererFront).compute(initCompute);
        const particleMassMultiplier = hash(instanceIndex.add(uint(31))).remap(.25, 1).toVar();
        const particleMass = particleMassMultiplier.mul(particleGlobalMass).toVar();

        const update = Fn(() => {
            const delta = float(1 / 60).mul(timeScale).toVar();
            const position = positionBuffer.element(instanceIndex);
            const velocity = velocityBuffer.element(instanceIndex);
            const force = vec3(0).toVar();

            Loop(attractorsLength, ({i}) => {
                const ap = attractorsPositions.element(i);
                const ax = attractorsRotationAxes.element(i);
                const to = ap.sub(position);
                const distance = to.length();
                const direction = to.normalize();
                const gravityStrength = attractorMass.mul(particleMass).mul(gravityConstant).div(distance.pow(2)).toVar();
                force.addAssign(direction.mul(gravityStrength));
                force.addAssign(ax.mul(gravityStrength).mul(spinningStrength).cross(to));
            });

            const absPos = position.abs();
            const q = absPos.sub(innerHalfExtent);
            const outside = vec3(q.x.max(0), q.y.max(0), q.z.max(0));
            const outsideDist = outside.length();
            const insideDepth = q.x.max(q.y).max(q.z).min(0).negate();
            const normal = position.sign().normalize();
            const range = float(.35);
            const nearStrength = range.sub(outsideDist).max(0).div(range);
            const totalStrength = nearStrength.add(insideDepth.mul(4));
            force.addAssign(normal.mul(totalStrength).mul(.35));
            velocity.addAssign(force.mul(delta));

            If(velocity.length().greaterThan(maxSpeed), () => {
                velocity.assign(velocity.normalize().mul(maxSpeed));
            });

            velocity.mulAssign(velocityDamping.oneMinus());
            position.addAssign(velocity.mul(delta));
            const half = boundHalfExtent.div(2).toVar();
            position.assign(mod(position.add(half), boundHalfExtent).sub(half));
        });

        updateCompute = update().compute(count);
        material.positionNode = positionBuffer.toAttribute();
        material.colorNode = Fn(() => {
            const speed = velocityBuffer.toAttribute().length();
            return vec4(mix(colorA, colorB, speed.div(maxSpeed).smoothstep(0, .5)), 1);
        })();

        material.scaleNode = particleMassMultiplier.mul(scale);
        scene.add(new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), material, count));
        const box = new THREE.Mesh(
            new THREE.BoxGeometry(INNER_DIM * 2, INNER_DIM * 2, INNER_DIM * 2),
            new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                wireframe: false,
                transparent: true,
                opacity: 0.0
        }));
        vehicleRig.add(box);

        if (renderer && renderer.inspector) {
            const gui = renderer.inspector.createParameters('Parameters');

            gui.add({attractorMassExponent: attractorMass.value.toString().length - 1}, 'attractorMassExponent', 1, 10, 1).onChange(value => attractorMass.value = Number(`1e${value}`));
            gui.add({particleGlobalMassExponent: particleGlobalMass.value.toString().length - 1}, 'particleGlobalMassExponent', 1, 10, 1).onChange(value => particleGlobalMass.value = Number(`1e${value}`));
            gui.add(maxSpeed, 'value', 0, 10, .01).name('maxSpeed');
            gui.add(velocityDamping, 'value', 0, .1, .001).name('velocityDamping');
            gui.add(spinningStrength, 'value', 0, 10, .01).name('spinningStrength');
            gui.add(scale, 'value', 0, .1, .001).name('scale');
            gui.add(boundHalfExtent, 'value', 0, 20, .01).name('boundHalfExtent');

            gui.addColor({color: colorA.value.getHexString(THREE.SRGBColorSpace)}, 'color').name('colorA').onChange(value => colorA.value.set(value));
            gui.addColor({color: colorB.value.getHexString(THREE.SRGBColorSpace)}, 'color').name('colorB').onChange(value => colorB.value.set(value));

            gui.add({controlsMode: attractors[0].controls.mode}, 'controlsMode', ['translate', 'rotate', 'none']).onChange(value => {
                for (const a of attractors) {
                    if (value === 'none') {
                        a.controls.visible = false;
                        a.controls.enabled = false;
                        a.helper.visible = false;
                        a.controls.showX = false;
                        a.controls.showY = false;
                        a.controls.showZ = false;
                    } else {
                        a.controls.visible = true;
                        a.controls.enabled = true;
                        a.helper.visible = true;
                        a.controls.showX = true;
                        a.controls.showY = true;
                        a.controls.showZ = true;
                        a.controls.mode = value;
                    }
                }
            });
        }
    }

    function animate() {
        controls.update();
        renderer.compute(updateCompute);
        renderSingle();
    }

    function renderSingle() {

        const w = window.innerWidth;
        const h = window.innerHeight;
        const third = Math.floor(w / 3);

        renderer.setScissorTest(true);

        renderer.setViewport(0, 0, third, h);
        renderer.setScissor(0, 0, third, h);
        renderer.render(scene, leftCamera);

        renderer.setViewport(third, 0, third, h);
        renderer.setScissor(third, 0, third, h);
        renderer.render(scene, frontCamera);

        renderer.setViewport(third * 2, 0, w - third * 2, h);
        renderer.setScissor(third * 2, 0, w - third * 2, h);
        renderer.render(scene, rightCamera);

        renderer.setScissorTest(false);

    }

    function onResize() {
        if (renderer) renderer.setSize(innerWidth, innerHeight);
        for (const c of [frontCamera, leftCamera, rightCamera]) {
            c.aspect = innerWidth / innerHeight;
            c.updateProjectionMatrix();
        }
    }
</script>
</body>
</html>
