<!DOCTYPE html>
<!-- This script was taken from the original Three.js repository at -->
<!-- https://github.com/mrdoob/three.js/blob/master/examples/webgpu_tsl_compute_attractors_particles.html -->
<html lang="en">
	<head>
		<title>Waldresidenz - attractors particles</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
		<!--			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>-->

			<div class="title-wrapper">
				<span>Die Waldresidenz</span>
			</div>

			<small>
				Mensch sein. Jeden Tag, jedes Wochenende.
			</small>
		</div>

		<video id="video" muted autoplay playsinline></video>
		<script>
			const video = document.getElementById('video');

			// Constraints define camera quality and type (user = front, environment = back)
			const constraints = {
				video: {
					frameRate: { ideal: 15 },
					width: { ideal: 160 },
					height: { ideal: 120 },
					facingMode: "user"
				},
				audio: false // Usually false for webcam display unless needed
			};

			// Request camera access
			navigator.mediaDevices.getUserMedia(constraints)
					.then((stream) => {
						video.srcObject = stream; // Attach stream to video element
					})
					.catch((err) => {
						console.error("Error accessing webcam: ", err);
					});
		</script>

		<script type="importmap">
			{
				"imports": {
					"three": "./node_modules/three/build/three.webgpu.js",
					"three/webgpu": "./node_modules/three/build/three.webgpu.js",
					"three/tsl": "./node_modules/three/build/three.tsl.js",
					"three/addons/": "./node_modules/three/examples/jsm/"
				}
			}
		</script>

		<script type="module" src="./src/main.js"></script>
	</body>
</html>
